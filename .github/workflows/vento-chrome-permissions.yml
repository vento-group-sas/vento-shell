name: VENTO Navigation Auth Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "templates/app-shell-standard/src/components/vento/standard/**"
      - "scripts/quality/vento-chrome-permission-guard.test.mjs"
      - ".github/workflows/vento-chrome-permissions.yml"
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  permissions:
    name: Synthetic auth and site permission regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run isolated identity and site regression
        run: node --test scripts/quality/vento-chrome-permission-guard.test.mjs
      - name: Typecheck permission guard
        run: npx tsc --noEmit --strict --skipLibCheck --target ES2017 --module esnext --moduleResolution bundler templates/app-shell-standard/src/components/vento/standard/permission-session-guard.ts
      - name: Lint Chrome and permission guard
        run: npx eslint templates/app-shell-standard/src/components/vento/standard/vento-chrome.tsx templates/app-shell-standard/src/components/vento/standard/permission-session-guard.ts scripts/quality/vento-chrome-permission-guard.test.mjs
