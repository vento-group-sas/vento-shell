name: Validar plan canónico

on:
  pull_request:
    paths:
      - "docs/plan-canonico/modular/**"
      - "scripts/docs/**"
      - ".node-version"
      - ".vscode/tasks.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-canonical-plan.yml"
  push:
    branches:
      - main
    paths:
      - "docs/plan-canonico/modular/**"
      - "scripts/docs/**"
      - ".node-version"
      - ".vscode/tasks.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-canonical-plan.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Compilar y verificar fuentes canónicas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clasificar alcance para fast lane documental, fisico y correccion
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          canonical_docs_only=true
          implementation_pr=false
          correction_pr=false

          if [ "${#changed[@]}" -eq 0 ]; then
            canonical_docs_only=false
          fi

          for file in "${changed[@]}"; do
            case "$file" in
              docs/plan-canonico/modular/*)
                ;;
              *)
                canonical_docs_only=false
                break
                ;;
            esac
          done

          if [[ "${HEAD_REF:-}" == implementation/* ]]; then
            implementation_pr=true
          fi

          if [[ "${HEAD_REF:-}" == correction/* || "${HEAD_REF:-}" == correction-register/* ]]; then
            correction_pr=true
          fi

          echo "canonical_docs_only=$canonical_docs_only" >> "$GITHUB_OUTPUT"
          echo "implementation_pr=$implementation_pr" >> "$GITHUB_OUTPUT"
          echo "correction_pr=$correction_pr" >> "$GITHUB_OUTPUT"
          printf 'canonical_docs_only=%s\n' "$canonical_docs_only"
          printf 'implementation_pr=%s\n' "$implementation_pr"
          printf 'correction_pr=%s\n' "$correction_pr"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Instalar dependencias bloqueadas
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verificar alcance fisico autorizado de implementacion
        if: github.event_name == 'pull_request' && steps.scope.outputs.implementation_pr == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: npm run docs:commit-scope:check -- --range "$BASE_SHA..$HEAD_SHA" --implementation-head-ref "$HEAD_REF"

      - name: Verificar alcance autorizado de correccion
        if: github.event_name == 'pull_request' && steps.scope.outputs.correction_pr == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: npm run docs:commit-scope:check -- --range "$BASE_SHA..$HEAD_SHA" --correction-head-ref "$HEAD_REF"

      - name: Verificar aislamiento de commits en pull request inicial
        if: github.event_name == 'pull_request' && github.event.action != 'synchronize' && steps.scope.outputs.implementation_pr != 'true' && steps.scope.outputs.correction_pr != 'true'
        run: npm run docs:commit-scope:check -- --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Verificar aislamiento de commits incorporados por el push actual
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize' && steps.scope.outputs.implementation_pr != 'true' && steps.scope.outputs.correction_pr != 'true'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE_SHA" "$HEAD_SHA"; then
            RANGE="$BEFORE_SHA..$HEAD_SHA"
          else
            RANGE="$BASE_SHA..$HEAD_SHA"
          fi
          npm run docs:commit-scope:check -- --range "$RANGE"

      - name: Verificar aislamiento de commits en push directo
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mapfile -t first_parent_new < <(git rev-list --first-parent "$BEFORE_SHA..$HEAD_SHA")
          only_merge_commits=true
          if [ "${#first_parent_new[@]}" -eq 0 ]; then
            only_merge_commits=false
          fi
          for commit in "${first_parent_new[@]}"; do
            parent_count=$(git rev-list --parents -n 1 "$commit" | awk '{print NF-1}')
            if [ "$parent_count" -lt 2 ]; then
              only_merge_commits=false
              break
            fi
          done
          if [ "$only_merge_commits" = true ]; then
            echo "Push a main compuesto solo por merge commits; el aislamiento por commit ya fue validado en el PR."
            exit 0
          fi
          npm run docs:commit-scope:check -- --range "$BEFORE_SHA..$HEAD_SHA"

      - name: Impedir nueva deuda de lint en pull request
        if: github.event_name == 'pull_request' && steps.scope.outputs.canonical_docs_only != 'true'
        run: npm run quality:lint:ratchet -- --range "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"

      - name: Impedir nueva deuda de lint en push
        if: github.event_name == 'push'
        run: npm run quality:lint:ratchet -- --range "${{ github.event.before }}..${{ github.sha }}"

      - name: Verificar fuentes y derivados versionados antes de compilar
        run: npm run docs:plan:check

      - name: Compilar plan canónico
        run: npm run docs:plan:build

      - name: Verificar que la compilación sea reproducible sin cambios
        run: git diff --exit-code -- docs/plan-canonico/modular

      - name: Probar continuidad documental
        if: steps.scope.outputs.canonical_docs_only != 'true' && steps.scope.outputs.implementation_pr != 'true'
        run: npm run docs:plan:test

      - name: Probar validador del registro TREQ
        if: steps.scope.outputs.canonical_docs_only != 'true' && steps.scope.outputs.implementation_pr != 'true'
        run: npm run docs:treq:test

      - name: Verificar registro TREQ
        if: steps.scope.outputs.canonical_docs_only != 'true' && steps.scope.outputs.implementation_pr != 'true'
        run: npm run docs:treq:check

      - name: Publicar compilado integral temporal
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: plan-canonico-compilado-${{ github.sha }}
          path: docs/plan-canonico/modular/.generated/PLAN_IMPLEMENTACION_VENTO_OS_CANONICO_COMPILADO.md
          retention-days: 7
          compression-level: 9
          if-no-files-found: error
