name: VISO labor terms and weekly overtime isolated QA

on:
  push:
    branches:
      - hotfix/viso-prod-overtime-sql-20261102
    paths:
      - .github/workflows/viso-labor-terms-isolated-qa.yml
      - supabase/migrations/20261102184824_viso_employee_labor_terms_week_authorizations.sql
      - supabase/migrations/20261102182951_viso_prod_monthly_overtime_publish.sql
      - tests/viso/overtime_labor_terms_fixture.sql
      - tests/viso/overtime_labor_terms_contract.sql
      - tests/viso/overtime_labor_terms_batch_publish.sql
  workflow_dispatch:

permissions:
  contents: read

jobs:
  labor-terms-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres_major: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres_major }}
        env:
          POSTGRES_DB: viso_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only-labor-terms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viso_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: synthetic-only-labor-terms
      PGDATABASE: viso_qa
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enforce isolated PostgreSQL identity
        run: |
          set -euo pipefail
          test "$PGDATABASE" = "viso_qa"
          test "$PGHOST" = "127.0.0.1"
          psql -X -v ON_ERROR_STOP=1 -c "select current_database(), current_user;"
      - name: Load synthetic schema and both canonical migrations
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/viso/overtime_labor_terms_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261102182951_viso_prod_monthly_overtime_publish.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261102184824_viso_employee_labor_terms_week_authorizations.sql
      - name: Verify authorization, effective terms, limits, revocation and RLS
        run: psql -X -v ON_ERROR_STOP=1 -f tests/viso/overtime_labor_terms_contract.sql
      - name: Verify bulk monthly update transaction with missing and approved extras
        run: psql -X -v ON_ERROR_STOP=1 -f tests/viso/overtime_labor_terms_batch_publish.sql
      - name: Verify rollback to prior VISO trigger guard without deleting labor evidence
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261102182951_viso_prod_monthly_overtime_publish.sql
          psql -X -v ON_ERROR_STOP=1 -tAc "select pg_get_functiondef('public.viso_enforce_monthly_schedule_publish_limit()'::regprocedure) like '%v_week_minutes > 54 * 60%';" | grep -qx t
          psql -X -v ON_ERROR_STOP=1 -tAc "select to_regclass('public.viso_labor_terms') is not null;" | grep -qx t
          psql -X -v ON_ERROR_STOP=1 -tAc "select count(*) from pg_trigger where tgname = 'trg_viso_monthly_schedule_publish_limit' and not tgisinternal;" | grep -qx 1
